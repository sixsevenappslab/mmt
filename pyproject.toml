[project]
name = "mmt"
version = "0.1.0"
description = "Marketing Measurement Toolkit — banco de pruebas de MMM, causalidad y atribucion"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
]

# Heavy modelling libraries are intentionally NOT listed here: Meridian (TensorFlow
# Probability) and PyMC-Marketing (PyTensor) do not resolve well together. Each one
# gets its own venv under .venvs/ — see AGENTS.md.

[tool.ruff]
line-length = 100
